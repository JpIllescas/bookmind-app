<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BookMind AI</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <meta name="color-scheme" content="light dark">
  <!-- Aplica el tema guardado antes de que arranque Angular: evita el parpadeo claro→oscuro. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('bookmind.tema');
        if (t === 'oscuro') document.documentElement.setAttribute('data-theme', 'dark');
        else if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
      // Si el navegador fuerza el modo oscuro, se usa el tema oscuro propio (misma regla que oscurecido-forzado.ts).
      try {
        var s = document.createElement('div');
        s.style.cssText = 'display:none;color-scheme:light;background-color:Canvas';
        document.documentElement.appendChild(s);
        var c = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(getComputedStyle(s).backgroundColor);
        s.remove();
        if (c && (+c[1] + +c[2] + +c[3]) / 3 < 128) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Tipografías del sistema de diseño (sección 8):
       Spectral para títulos, Public Sans para interfaz. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Spectral:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
