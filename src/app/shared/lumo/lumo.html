@if (mensaje(); as texto) {
  <!-- Dos ramas iguales que se alternan con cada mensaje: el elemento se recrea y vuelve a animarse. -->
  @if (alterno()) {
    <div class="burbuja" role="status">{{ texto }}</div>
  } @else {
    <div class="burbuja" role="status">{{ texto }}</div>
  }
}

<!-- Interactivo es un botón alcanzable por teclado; pasivo, solo una imagen. -->
<svg
  class="zorro"
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
  [attr.role]="interactivo() ? 'button' : 'img'"
  [attr.tabindex]="interactivo() ? 0 : null"
  [attr.aria-label]="interactivo() ? 'Lumo, el zorro lector. Tócalo para un consejo' : 'Lumo, el zorro lector'"
  (click)="alPulsar()"
  (keydown.enter)="alTecla($event)"
  (keydown.space)="alTecla($event)"
  (pointerenter)="alEntrar()"
  (pointerleave)="alSalir()"
  (focus)="alEntrar()"
  (blur)="alSalir()"
>
  <defs>
    <linearGradient [id]="uid + '-pelaje'" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3934d" />
      <stop offset="1" stop-color="#d9692b" />
    </linearGradient>
    <radialGradient [id]="uid + '-cabeza'" cx="0.42" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f6a05e" />
      <stop offset="1" stop-color="#e37a37" />
    </radialGradient>
    <linearGradient [id]="uid + '-mascara'" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf1e2" />
      <stop offset="1" stop-color="#f6dfc5" />
    </linearGradient>
    <radialGradient [id]="uid + '-sombra-cabeza'">
      <stop offset="0" stop-color="#5a2a12" stop-opacity="0.3" />
      <stop offset="1" stop-color="#5a2a12" stop-opacity="0" />
    </radialGradient>
    <linearGradient [id]="uid + '-cola'" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d9692b" />
      <stop offset="1" stop-color="#f3934d" />
    </linearGradient>
  </defs>

  <!-- Sombra en el suelo: ancla al zorro y evita que parezca flotar. -->
  <ellipse class="sombra" cx="100" cy="187" rx="40" ry="5" />

  <!-- Cola tupida, detrás de todo: la base y la punta giran con retardo distinto -->
  <g class="cola">
    <path
      d="M122 156 C 140 164 162 162 176 150 C 188 140 191 130 189 118 C 188 114 187 111 186 109 C 182 102 175 98 168 100 C 166 116 158 130 146 140 C 138 146 130 150 122 150 Z"
      [attr.fill]="'url(#' + uid + '-cola)'"
    />
    <g class="cola__punta">
      <path d="M168 100 C 175 98 182 102 186 109 C 187 111 188 114 189 118 C 190 126 188 133 184 139 C 183 135 181 133 178 132 C 180 130 181 127 180 125 C 178 124 176 124 175 125 C 176 117 173 108 168 100 Z" [attr.fill]="'url(#' + uid + '-mascara)'" />
    </g>
  </g>

  <g class="cuerpo">
    <!-- Cuerpo en forma de pera: una sola silueta, no dos elipses -->
    <path
      d="M72 116 C 52 130, 46 160, 58 180 C 68 192, 132 192, 142 180 C 154 160, 148 130, 128 116 Z"
      [attr.fill]="'url(#' + uid + '-pelaje)'"
    />
    <!-- Lomo en sombra hacia la cola -->
    <path d="M128 118 C 146 134, 150 164, 140 182 C 146 164, 144 138, 124 122 Z" fill="rgba(0,0,0,0.09)" />

    <!-- Pecho de pelaje claro con el borde en mechones -->
    <path
      d="M76 132 C 80 129 84 128 88 131 C 92 127 96 126 100 130 C 104 126 108 127 112 131 C 116 128 120 129 124 132 C 132 152, 128 178, 100 179 C 72 178, 68 152, 76 132 Z"
      [attr.fill]="'url(#' + uid + '-mascara)'"
    />

    <!-- Patas con tres dedos, solapando el cuerpo -->
    <g class="patas">
      <path d="M62 182 C 60 172, 70 168, 80 170 C 90 168, 98 174, 94 182 C 92 188, 64 188, 62 182 Z" fill="#c96a2e" />
      <path d="M106 182 C 102 174, 110 168, 120 170 C 130 168, 140 172, 138 182 C 136 188, 108 188, 106 182 Z" fill="#c96a2e" />
      <path d="M71 178 v6 M78 176 v8 M85 178 v6 M115 178 v6 M122 176 v8 M129 178 v6" stroke="#b4552e" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- Bufanda con pliegue, bajo los brazos para que no los tape -->
    <path d="M60 114 C 78 128, 122 128, 140 114 L 138 127 C 120 141, 80 141, 62 127 Z" fill="#b4552e" />
    <path d="M64 121 C 80 131, 120 131, 136 121" stroke="#a24a26" stroke-width="2" fill="none" stroke-linecap="round" />
    <g class="bufanda-cabo">
      <path d="M67 125 L 58 154 L 74 156 L 81 129 Z" fill="#a24a26" />
      <path d="M62 141 L 78 143" stroke="#c96a2e" stroke-width="2" stroke-linecap="round" />
      <path class="flecos" d="M60 155 l -2 8 M66 156 l -1 8 M72 156 l 0 8" stroke="#a24a26" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Sombra que proyecta la cabeza: sin ella parece flotar sobre el cuerpo -->
    <ellipse cx="100" cy="121" rx="40" ry="9" [attr.fill]="'url(#' + uid + '-sombra-cabeza)'" />

    <!-- Brazo izquierdo en reposo; se cambia por el levantado al saludar -->
    <g class="brazo-reposo">
      <path d="M66 122 C 56 132, 52 146, 57 161 L 68 163 C 65 150, 67 138, 78 128 Z" fill="#e8813f" />
      <ellipse cx="62" cy="164" rx="8.5" ry="6.5" fill="#c96a2e" />
      <path d="M58 162 v5 M63 161 v6" stroke="#b4552e" stroke-width="1.6" stroke-linecap="round" />
    </g>

    <!-- Brazo que saluda (izquierdo) -->
    <g class="brazo-saludo">
      <path d="M62 120 C 48 116, 40 104, 43 90 L 53 91 C 52 101, 58 110, 72 116 Z" fill="#e8813f" />
      <circle cx="46" cy="88" r="8" fill="#c96a2e" />
      <path d="M42 84 l -1 -5 M46 82 l 0 -5 M50 84 l 1 -5" stroke="#c96a2e" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Brazo con el libro (derecho), delante del cuerpo -->
    <g class="brazo-libro">
      <path d="M128 118 C 142 122, 151 136, 147 152 L 136 152 C 138 140, 134 130, 122 126 Z" fill="#e8813f" />
      <g class="libro" transform="translate(110 128) rotate(-10)">
        <rect width="42" height="30" rx="3" fill="#b4552e" />
        <rect x="3" y="3" width="36" height="24" rx="2" fill="#fbf8f2" />
        <path d="M21 3 V27" stroke="#e6cbbb" stroke-width="1.5" />
        <path d="M8 11 h9 M8 16 h9 M8 21 h6 M25 11 h9 M25 16 h9 M25 21 h6" stroke="#d3cbba" stroke-width="1.6" stroke-linecap="round" />
        <!-- Página que pasa mientras lee: lleva sus propias líneas para que el giro se lea -->
        <g class="pagina">
          <rect x="21" y="3" width="18" height="24" rx="2" fill="#f3ede2" />
          <path d="M25 11 h9 M25 16 h9 M25 21 h6" stroke="#d3cbba" stroke-width="1.6" stroke-linecap="round" />
        </g>
        <path d="M33 1 v12 l 3 -3 l 3 3 v-12 z" fill="#c9503f" />
      </g>
      <ellipse cx="141" cy="154" rx="8.5" ry="6.5" fill="#c96a2e" />
      <path d="M138 152 v5 M143 151 v6" stroke="#b4552e" stroke-width="1.6" stroke-linecap="round" />
    </g>
  </g>

  <!-- Cabeza -->
  <g class="cabeza">
    <!-- Mechón en la coronilla, detrás de la cabeza -->
    <path d="M86 46 L 92 30 L 99 42 L 105 27 L 112 44 Z" fill="#e37a37" />

    <g class="oreja oreja--izq">
      <path d="M62 66 C 54 46, 56 26, 64 12 C 78 22, 90 34, 94 52 Z" fill="#e37a37" />
      <path d="M64 12 C 60 20, 58 28, 58 36 C 63 30, 69 26, 76 24 Z" fill="#b4552e" />
      <path d="M68 60 C 64 46, 66 34, 70 26 C 80 34, 86 42, 88 52 Z" fill="#fbe9d3" />
    </g>
    <g class="oreja oreja--der">
      <path d="M138 66 C 146 46, 144 26, 136 12 C 122 22, 110 34, 106 52 Z" fill="#e37a37" />
      <path d="M136 12 C 140 20, 142 28, 142 36 C 137 30, 131 26, 124 24 Z" fill="#b4552e" />
      <path d="M132 60 C 136 46, 134 34, 130 26 C 120 34, 114 42, 112 52 Z" fill="#fbe9d3" />
    </g>

    <path d="M100 39 C 126 39 146 55 147 78 C 148 92 142 106 130 114 C 121 119 111 121 100 121 C 89 121 79 119 70 114 C 58 106 52 92 53 78 C 54 55 74 39 100 39 Z" [attr.fill]="'url(#' + uid + '-cabeza)'" />

    <!-- Mechones de las mejillas en curvas, con el mismo degradado que el hocico -->
    <path d="M60 84 C 56 87 52 89 47 90 C 51 92 54 94 56 96 C 52 99 49 101 45 104 C 49 105 54 106 58 106 C 57 109 56 111 54 114 C 59 113 64 112 68 110 C 72 100 70 92 60 84 Z" [attr.fill]="'url(#' + uid + '-mascara)'" />
    <path d="M140 84 C 144 87 148 89 153 90 C 149 92 146 94 144 96 C 148 99 151 101 155 104 C 151 105 146 106 142 106 C 143 109 144 111 146 114 C 141 113 136 112 132 110 C 128 100 130 92 140 84 Z" [attr.fill]="'url(#' + uid + '-mascara)'" />
    <path d="M66 86 C 74 118, 126 118, 134 86 C 122 104, 78 104, 66 86 Z" [attr.fill]="'url(#' + uid + '-mascara)'" />

    <!-- Nariz y bigotes -->
    <path d="M63 98 L 51 96.5 M63 103 L 52 106 M137 98 L 149 96.5 M137 103 L 148 106" stroke="#d9a07a" stroke-width="1.2" stroke-linecap="round" opacity="0.65" />
    <ellipse cx="100" cy="97" rx="6.5" ry="4.5" fill="#2a2620" />
    <ellipse cx="98" cy="95.5" rx="2" ry="1.2" fill="#fff" opacity="0.5" />

    <!-- Bocas: una por expresión -->
    <g class="bocas" stroke="#2a2620" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path class="boca boca--sonrisa" d="M100 102 C 96 107, 92 107, 90 105 M100 102 C 104 107, 108 107, 110 105" />
      <path class="boca boca--linea" d="M94 105 H 106" />
      <g class="boca boca--abierta">
        <path d="M90 103 C 94 113, 106 113, 110 103 Z" fill="#2a2620" stroke="none" />
        <ellipse cx="100" cy="110" rx="4" ry="2.4" fill="#e06c6c" stroke="none" />
      </g>
      <circle class="boca boca--o" cx="100" cy="106" r="3.6" fill="#2a2620" stroke="none" />
      <path class="boca boca--triste" d="M93 108 Q 100 103.5, 107 108" />
    </g>

    <!-- Mejillas -->
    <circle cx="70" cy="92" r="6" fill="#f2a58a" opacity="0.5" />
    <circle cx="130" cy="92" r="6" fill="#f2a58a" opacity="0.5" />

    <!-- Cejas: dan la expresión de cada estado -->
    <g class="cejas" stroke="#c96a2e" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path class="ceja ceja--izq" d="M73 64 Q 82 60, 91 64" />
      <path class="ceja ceja--der" d="M109 64 Q 118 60, 127 64" />
    </g>

    <!-- Ojos abiertos: la pupila sigue al puntero -->
    <g class="ojos">
      <g class="ojo ojo--izq">
        <ellipse cx="82" cy="78" rx="8" ry="8.5" fill="#fff" />
        <g class="iris">
          <circle cx="82" cy="78" r="5.2" fill="#6b3a1a" />
          <circle cx="82" cy="78" r="3.2" fill="#1f1712" />
          <circle cx="80" cy="76" r="1.7" fill="#fff" />
        </g>
      </g>
      <g class="ojo ojo--der">
        <ellipse cx="118" cy="78" rx="8" ry="8.5" fill="#fff" />
        <g class="iris">
          <circle cx="118" cy="78" r="5.2" fill="#6b3a1a" />
          <circle cx="118" cy="78" r="3.2" fill="#1f1712" />
          <circle cx="116" cy="76" r="1.7" fill="#fff" />
        </g>
      </g>
    </g>

    <!-- Párpados cerrados: los dos (duerme, celebra) o solo el izquierdo (guiño) -->
    <g class="parpados" stroke="#2a2620" stroke-width="2.6" fill="none" stroke-linecap="round">
      <path class="parpado parpado--izq" d="M75 79 Q 82 85, 89 79" />
      <path class="parpado parpado--der" d="M111 79 Q 118 85, 125 79" />
    </g>

    <!-- Lentes de lectura -->
    <g class="lentes" stroke="#3a2f2a" stroke-width="2.4" fill="rgba(255,255,255,0.14)" stroke-linecap="round">
      <circle cx="82" cy="78" r="12.5" />
      <circle cx="118" cy="78" r="12.5" />
      <path d="M94.5 77 Q 100 73, 105.5 77" fill="none" />
      <path d="M69.5 76 L 60 72 M130.5 76 L 140 72" fill="none" />
      <!-- Reflejo del cristal -->
      <path d="M74 72 Q 78 68, 84 68 M110 72 Q 114 68, 120 68" stroke="rgba(255,255,255,0.55)" stroke-width="1.6" fill="none" />
    </g>
  </g>

  <!-- Adornos por estado -->
  <g class="zzz" fill="#8c8577" font-family="Public Sans, sans-serif" font-weight="700">
    <text x="146" y="46" font-size="14">z</text>
    <text x="158" y="30" font-size="18">z</text>
  </g>

  <g class="estrellas" fill="#e0a911">
    <path class="estrella" d="M32 40 l 3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 z" />
    <path class="estrella" d="M168 34 l 2.5 6 6 1 -4.5 4 1 6 -5 -3 -5 3 1 -6 -4.5 -4 6 -1 z" />
    <path class="estrella" d="M150 12 l 2 4 4 .5 -3 3 .7 4 -3.7 -2 -3.7 2 .7 -4 -3 -3 4 -.5 z" />
    <path class="estrella" d="M44 18 l 2 4 4 .5 -3 3 .7 4 -3.7 -2 -3.7 2 .7 -4 -3 -3 4 -.5 z" />
  </g>

  <g class="pensando" fill="#8c8577">
    <circle cx="150" cy="44" r="3" />
    <circle cx="160" cy="34" r="4" />
    <circle cx="172" cy="22" r="5" />
  </g>
</svg>
